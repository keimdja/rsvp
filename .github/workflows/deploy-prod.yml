# .github/workflows/deploy-prod.yml
# Push to main -> build -> deploy to this repo's GitHub Pages site.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write environment
        run: node scripts/write-env.mjs
        env:
          APP_ENV: production
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Check API boundary
        run: node scripts/check-api-boundary.mjs
      - name: Build
        run: npx ng build --configuration production --base-href "${{ vars.BASE_HREF || format('/{0}/', github.event.repository.name) }}"

      - name: SPA fallback for deep links
        run: |
          cp dist/rsvp/browser/index.html dist/rsvp/browser/404.html
          touch dist/rsvp/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rsvp/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4