<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>body{margin:0;background:#f6f6f4;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1c1c1a}a{color:#1c1c1a}a:hover{color:#2f6feb}</style></helmet>
<main style="max-width:1040px;margin:0 auto;padding:56px 24px 80px;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:8px;max-width:620px">
    <h1 style="margin:0;font:600 24px/1.2 'IBM Plex Sans',sans-serif">RSVP logo</h1>
    <p style="margin:0;color:#62625d;font-size:15px;line-height:1.55;text-wrap:pretty">Three reply choices, one picked: Yes, Maybe, No. The mark echoes the segmented choice guests tap on every RSVP page. It stays ink-only so it never competes with an event's theme.</p>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="height:280px;display:grid;place-items:center;background:#fff;border:1px solid #e4e3df;border-radius:10px">
        <svg viewBox="0 0 64 64" width="144" height="144" role="img" aria-label="RSVP mark"><rect width="64" height="64" rx="15" fill="#1c1c1a"></rect><circle cx="15" cy="32" r="6" fill="#ffffff"></circle><circle cx="32" cy="32" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.5"></circle><circle cx="49" cy="32" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.5"></circle></svg>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:500">Mark</span><a href="logo-mark.svg" download="rsvp-mark.svg">Download SVG</a></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="height:280px;display:grid;place-items:center;background:#fff;border:1px solid #e4e3df;border-radius:10px">
        <svg viewBox="0 0 220 64" width="275" height="80" role="img" aria-label="RSVP"><rect width="64" height="64" rx="15" fill="#1c1c1a"></rect><circle cx="15" cy="32" r="6" fill="#ffffff"></circle><circle cx="32" cy="32" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.5"></circle><circle cx="49" cy="32" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.5"></circle><text x="82" y="44" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5" fill="#1c1c1a">rsvp</text></svg>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:500">Lockup</span><a href="logo-lockup.svg" download="rsvp-lockup.svg">Download SVG</a></div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
    <div style="height:180px;display:grid;place-items:center;background:#1c1c1a;border-radius:10px">
      <svg viewBox="0 0 220 64" width="220" height="64" role="img" aria-label="RSVP on dark"><rect width="64" height="64" rx="15" fill="#ffffff"></rect><circle cx="15" cy="32" r="6" fill="#1c1c1a"></circle><circle cx="32" cy="32" r="4.5" fill="none" stroke="#1c1c1a" stroke-width="2.5"></circle><circle cx="49" cy="32" r="4.5" fill="none" stroke="#1c1c1a" stroke-width="2.5"></circle><text x="82" y="44" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5" fill="#ffffff">rsvp</text></svg>
    </div>
    <div style="height:180px;display:flex;align-items:center;justify-content:center;gap:28px;background:#fff;border:1px solid #e4e3df;border-radius:10px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><svg viewBox="0 0 64 64" width="64" height="64"><rect width="64" height="64" rx="15" fill="#1c1c1a"></rect><circle cx="15" cy="32" r="6" fill="#fff"></circle><circle cx="32" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="2.5"></circle><circle cx="49" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="2.5"></circle></svg><span style="font:11px 'IBM Plex Mono',monospace;color:#62625d">64</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><svg viewBox="0 0 64 64" width="32" height="32"><rect width="64" height="64" rx="15" fill="#1c1c1a"></rect><circle cx="15" cy="32" r="6" fill="#fff"></circle><circle cx="32" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="2.5"></circle><circle cx="49" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="2.5"></circle></svg><span style="font:11px 'IBM Plex Mono',monospace;color:#62625d">32</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><svg viewBox="0 0 64 64" width="20" height="20"><rect width="64" height="64" rx="15" fill="#1c1c1a"></rect><circle cx="15" cy="32" r="6" fill="#fff"></circle><circle cx="32" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="3.5"></circle><circle cx="49" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="3.5"></circle></svg><span style="font:11px 'IBM Plex Mono',monospace;color:#62625d">20</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><svg viewBox="0 0 64 64" width="16" height="16"><rect width="64" height="64" rx="15" fill="#1c1c1a"></rect><circle cx="15" cy="32" r="6" fill="#fff"></circle><circle cx="32" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="4"></circle><circle cx="49" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="4"></circle></svg><span style="font:11px 'IBM Plex Mono',monospace;color:#62625d">16</span></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px">
    <span style="font-weight:600;font-size:14px">In the admin header</span>
    <div style="height:56px;display:flex;align-items:center;padding:0 24px;background:#fff;border:1px solid #e4e3df;border-radius:10px">
      <svg viewBox="0 0 220 64" width="83" height="24" role="img" aria-label="RSVP"><rect width="64" height="64" rx="15" fill="#1c1c1a"></rect><circle cx="15" cy="32" r="6" fill="#fff"></circle><circle cx="32" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="3.5"></circle><circle cx="49" cy="32" r="4.5" fill="none" stroke="#fff" stroke-width="3.5"></circle><text x="82" y="44" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5" fill="#1c1c1a">rsvp</text></svg>
    </div>
  </div>
</main>
</x-dc>
</body>
</html>
